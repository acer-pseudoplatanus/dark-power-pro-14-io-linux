name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Releases are driven by annotated tags (see docs/RELEASE.md).
  release:
    types: [created]

# Least privilege: read-only by default; only the publish job escalates.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      # Actions pinned by SHA (node_exporter convention) — version in comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: |
          ruff check bqio/ tests/
          ruff format --check bqio/ tests/

      - name: Type check (mypy strict)
        run: mypy bqio/

      - name: Test (coverage gate)
        run: python -m pytest tests/ --cov=bqio --cov-report=term-missing

  # Privacy gate: reject pushes whose history exposes internal identifiers
  # (hostnames, LAN addresses, local mail domains) in commit metadata or
  # file contents. Mirrors the local pre-push hook.
  privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan full history for internal identifiers
        run: |
          set -euo pipefail
          # Marker regex is hex-encoded and decoded at runtime so this
          # workflow file contains no literal internal identifiers
          # (the local pre-push scanner greps for the assembled forms).
          # Decoded meaning: brand fingerprint (two spellings),
          # fruit emoji, LAN CIDR, machine-local mail domains.
          HEX='63 68 65 72 72 79 2d 6c 61 62 73 7c 6b 69 72 73 63 68 7c f0 9f 8d 92 7c 31 39 32 5c 2e 31 36 38 5c 2e 30 5c 2e 7c 40 6c 6f 63 61 6c 68 6f 73 74 7c 40 5b 41 2d 5a 61 2d 7a 30 2d 39 2e 2d 5d 2a 5c 2e 6c 6f 63 61 6c'
          MARKERS=$(python3 -c "import sys; print(bytes.fromhex(sys.argv[1]).decode())" "$HEX")
          HITS=0
          # Commit metadata (author/committer names + emails + messages)
          if git log --all --format='A:%an <%ae> C:%cn <%ce> %s%n%b' | grep -qiE "$MARKERS"; then
            echo "::error::Internal identifier found in commit metadata"
            HITS=1
          fi
          # File contents across the full history
          if git log --all -p | grep -qiE "$MARKERS"; then
            echo "::error::Internal identifier found in tracked file contents"
            HITS=1
          fi
          if [[ "$HITS" -eq 1 ]]; then
            echo "Fix: rewrite history with git filter-repo + mailmap,"
            echo "then force-push from the public zone clone."
            exit 1
          fi
          echo "Privacy scan clean."

  # Prove the package builds a clean sdist + wheel on the oldest supported
  # interpreter. Runs once (not per matrix leg) to keep CI fast.
  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata (twine)
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: dist
          path: dist/
